[project]
name = "pet-classifier"
version = "0.1.0"
description = "Fine-grained cat & dog breed classification (37 classes) on the Oxford-IIIT Pet dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pillow>=10.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Web demo (Member 3) — kept optional so the core pipeline installs lean.
app = [
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pet_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
